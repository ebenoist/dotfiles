# The 1440 work VM desktop, parked full-screen on workspace 5.
#
# Scoped by title, not by app_id alone: remmina is the general RDP client on
# this box, so a bare app_id rule would drag every other connection -- and the
# connection list itself -- onto 5. app_id rather than class because remmina is
# a native Wayland client (StartupWMClass=org.remmina.Remmina).
assign [app_id="org.remmina.Remmina" title="^work-1440"] workspace number 5
for_window [app_id="org.remmina.Remmina" title="^work-1440"] fullscreen enable

exec /home/erik/bin/workvm --park
