# Remote-work output config.
#
# HEADLESS-1: virtual output Sunshine/wayvnc target, always available.
# HDMI-A-1:   iDRAC's virtual KVM framebuffer. Sunshine prefers it over
#             headless if it's enabled, so disable it here. iDRAC's hardware
#             KVM (BIOS, pre-boot) still works regardless of this setting.
#
# When the physical monitors come back, their `output` lines in the
# main config (matched by EDID) take effect; this file doesn't interfere.
exec swaymsg create_output HEADLESS
output HEADLESS-1 resolution 2560x1440 pos 9999 0
output HEADLESS-2 disable
output HDMI-A-1 disable
workspace 6 output HEADLESS-1
