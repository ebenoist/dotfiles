# Remote-work output config.
#
# HEADLESS-1: virtual output Sunshine/wayvnc target, always available.
#             Sunshine is pinned to it via output_name in sunshine.conf,
#             so other outputs can't steal the stream.
# HDMI-A-1:   JetKVM capture (EDID reads "JetKVM v1"). Kept out of the main
#             layout — overlapping it with $center made clients render at the
#             KVM's scale 1 and go blurry on the 4K panel. kvm-mirror
#             screencopies $center onto it instead, and stops when the dongle
#             is unplugged: a mirror left on the output it mirrors recurses.
#
# When the physical monitors come back, their `output` lines in the
# main config (matched by EDID) take effect; this file doesn't interfere.
exec swaymsg create_output HEADLESS
output HEADLESS-1 resolution 2560x1440 pos 9999 0
output HEADLESS-2 disable
output HDMI-A-1 mode 1920x1080@60Hz scale 1 pos 9999 1440
no_focus [app_id="at.yrlf.wl_mirror"]
# Workspace 12 is pinned to HDMI-A-1 in the main config; targeting the
# workspace resolves even before the output config has settled, whereas
# `move container to output` silently no-ops and drops the mirror on the
# focused workspace.
for_window [app_id="at.yrlf.wl_mirror"] move container to workspace number 12, fullscreen enable
exec_always /home/erik/bin/kvm-mirror watch
